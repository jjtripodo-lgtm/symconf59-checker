    type: preprint
    relationship: formalizes
    authors: ["John Tripodo"]
    location: "https://hexagonmath.org/2611.00901v1"
    note: "The main nonexistence theorem is compared. The submitted proof is a port of the already public Lean development accompanying the preprint."
  - title: "Checker for symmetric configuration 59₈"
    type: software
    relationship: adapts
    authors: ["John Tripodo"]
    location: "https://github.com/jjtripodo-lgtm/symconf59-checker/tree/71db581317719397e01fa182cdce91358a444b0b"
    note: "Original proof source. The companion Python computations were replayed for reproducibility and are not imported by the compared Lean proof."
  - title: "On constructions and parameters of symmetric configurations v_k"
    type: paper
    relationship: background
    authors: ["Alexander A. Davydov", "Giorgio Faina", "Massimo Giulietti", "Stefano Marcugini", "Fernanda Pambianco"]
    location: "https://arxiv.org/abs/1203.0709"
    note: "Tables 6.1 and 7.1 separate the cyclic and unrestricted parameter problems."
