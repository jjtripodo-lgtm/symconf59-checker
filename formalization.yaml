version: v0.4
project:
  name: "There is no symmetric configuration 59₈"
  description: >-
    No symmetric incidence configuration exists with 59 points and 59 lines,
    eight incidences at every point and line, and at most one common line for
    any two distinct points. The compared declaration states the equivalent
    binary integer incidence-matrix theorem. It places no restriction on the
    automorphism group or the cycle types of the leave graphs. The proof
    derives leave-graph constraints from an arbitrary incidence matrix and
    closes the resulting finite cases in Lean. Davydov, Faina, Giulietti,
    Marcugini and Pambianco distinguish this unrestricted case, listed as
    undecided in their Table 7.1, from the cyclic case in Table 6.1.
  authors: ["John Tripodo"]
  responsible_maintainers: ["John Tripodo"]
  license: Apache-2.0
classification:
  arxiv: [math.CO]
  msc2020: ["05B30", "05B05", "68V20"]
sources:
